<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Post - Shaikh Shafaq Ali</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <style>
        :root{--bg:#0d0d18;--bg2:#13131f;--bg3:#1a1a2e;--card:#161624;--text:#eeeef5;--muted:rgba(238,238,245,.6);--dim:rgba(238,238,245,.36);--accent:#c084fc;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12)}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Instrument Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
        body::before{content:'';position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.024) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.024) 1px,transparent 1px);background-size:48px 48px}
        a{color:inherit}
        nav{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;border-bottom:1px solid var(--border);background:rgba(13,13,24,.82);backdrop-filter:blur(16px);position:sticky;top:0;z-index:5}
        .brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;text-decoration:none}
        .brand em{font-style:normal;color:var(--accent)}
        .back-link{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-size:.84rem;font-weight:700;border:1px solid var(--border2);border-radius:10px;padding:8px 14px;transition:.18s}
        .back-link:hover{color:var(--text);border-color:rgba(192,132,252,.38);background:rgba(192,132,252,.06)}
        main{max-width:880px;margin:0 auto;padding:4rem 2rem 5rem}
        .loading,.empty{padding:5rem 1rem;text-align:center;color:var(--muted)}
        .cover{width:100%;height:min(430px,50vw);min-height:240px;border:1px solid var(--border2);border-radius:22px;overflow:hidden;background:var(--bg3);display:flex;align-items:center;justify-content:center;margin-bottom:2rem}
        .cover img{width:100%;height:100%;object-fit:cover;display:block}
        .placeholder{font-size:3rem;opacity:.18}
        .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:1rem;color:var(--dim);font-size:.78rem;font-weight:600}
        .category{font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(192,132,252,.32);border-radius:100px;padding:4px 10px;color:var(--accent);background:rgba(192,132,252,.08)}
        h1{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(2.2rem,6vw,4.4rem);line-height:1.04;letter-spacing:-.03em;margin-bottom:1rem}
        .excerpt{font-size:1.02rem;line-height:1.8;color:var(--muted);margin-bottom:2rem}
        .article{background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:2.3rem}
        .article h2,.article h3{font-family:'Bricolage Grotesque',sans-serif;color:var(--text);margin:1.6rem 0 .7rem;letter-spacing:-.02em}
        .article h2:first-child,.article h3:first-child{margin-top:0}
        .article p{color:var(--muted);line-height:1.9;margin-bottom:1.15rem}
        .article em{font-family:'Instrument Serif',serif;font-size:1.05em}
        .article strong{color:var(--text)}
        .article ul,.article ol{color:var(--muted);line-height:1.8;padding-left:1.3rem;margin-bottom:1.1rem}
        .article li{margin-bottom:.4rem}
        .article blockquote{border-left:3px solid var(--accent);background:rgba(192,132,252,.06);border-radius:0 10px 10px 0;padding:1rem 1.2rem;margin:1rem 0;color:var(--muted);font-family:'Instrument Serif',serif;font-style:italic}
        .article code{font-family:monospace;background:rgba(192,132,252,.12);border:1px solid rgba(192,132,252,.22);border-radius:5px;padding:2px 6px;color:var(--accent)}
        .article pre{overflow:auto;background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:1rem;margin-bottom:1.1rem}
        .article pre code{background:transparent;border:0;padding:0;color:var(--text)}
        .external{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border-radius:10px;padding:10px 18px;font-size:.86rem;font-weight:800;background:var(--accent);color:#0d0d18;margin-bottom:1.6rem}
        @media(max-width:700px){nav{padding:0 1.2rem}main{padding:3rem 1.2rem 4rem}.article{padding:1.4rem}.cover{height:260px}}
    </style>
</head>

<body>
    <nav>
        <a class="brand" href="index.html">SA<em>.</em></a>
        <a class="back-link" href="index.html#blog">&larr; Back to blog</a>
    </nav>
    <main id="app"><div class="loading">Loading post...</div></main>

    <script>
    (function(){
        'use strict';
        const API_BASE='https://portfolio-shafaq.onrender.com';
        const app=document.getElementById('app');
        const params=new URLSearchParams(location.search);
        const key=params.get('slug')||params.get('id')||'';

        function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
        function slugify(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
        function formatDate(value){
            if(!value)return'';
            const d=new Date(value);
            if(Number.isNaN(d.getTime()))return'';
            return d.toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'});
        }
        function mdToHtml(text){
            if(!text)return'';
            return text
                .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/```[\w]*\n?([\s\S]*?)```/g,'<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/g,'<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g,'<em>$1</em>')
                .replace(/^## (.+)$/gm,'<h2>$1</h2>')
                .replace(/^### (.+)$/gm,'<h3>$1</h3>')
                .replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
                .replace(/^[-*] (.+)$/gm,'<li>$1</li>')
                .replace(/(<li>[\s\S]*?<\/li>)(\n|$)/g,'<ul>$1</ul>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
                .split(/\n{2,}/).map(part=>/^<(\w+)/.test(part.trim())?part:'<p>'+part.replace(/\n/g,' ')+'</p>').join('');
        }
        function findPost(posts){
            if(!posts||!posts.length)return null;
            return posts.find(p=>String(p._id||'')===key||String(p.slug||'')===key||slugify(p.title)===key)||null;
        }
        function renderPost(p){
            const date=formatDate(p.createdAt);
            const excerpt=String(p.excerpt||'').trim();
            const fullContent=String(p.content||'').trim();
            const hasContent=fullContent&&fullContent!==excerpt;
            const articleHtml=hasContent
                ? `<article class="article">${mdToHtml(fullContent)}</article>`
                : (!excerpt?'<article class="article"><p>Full post content has not been added yet.</p></article>':'');
            document.title=(p.title||'Blog Post')+' - Blog';
            app.innerHTML=`
${p.cover_image?`<div class="cover"><img src="${esc(p.cover_image)}" alt="${esc(p.title)}" onerror="this.parentElement.innerHTML='<div class=&quot;placeholder&quot;>Post</div>'"></div>`:`<div class="cover"><div class="placeholder">Post</div></div>`}
<div class="meta">
  ${p.category?`<span class="category">${esc(p.category)}</span>`:''}
  ${date?`<span>${date}</span>`:''}
  ${p.read_time?`<span>${esc(p.read_time)}</span>`:''}
</div>
<h1>${esc(p.title||'Untitled Post')}</h1>
${excerpt?`<p class="excerpt">${esc(excerpt)}</p>`:''}
${p.external_url?`<a class="external" href="${esc(p.external_url)}" target="_blank" rel="noopener">Open original post</a>`:''}
${articleHtml}`;
        }
        fetch(API_BASE+'/api/portfolio')
            .then(r=>r.json())
            .then(data=>{
                const post=findPost(data.blogPosts||[]);
                if(!post){app.innerHTML='<div class="empty">Blog post not found.</div>';return;}
                renderPost(post);
            })
            .catch(()=>{app.innerHTML='<div class="empty">Could not load blog post. Please try again later.</div>';});
    })();
    </script>
</body>

</html>
