<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Details - Shaikh Shafaq Ali</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root{--bg:#0d0d18;--bg2:#13131f;--bg3:#1a1a2e;--card:#161624;--text:#eeeef5;--muted:rgba(238,238,245,.58);--dim:rgba(238,238,245,.34);--accent:#c084fc;--now:#4ade80;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12)}
        *{box-sizing:border-box;margin:0;padding:0}
        html{scrollbar-width:thin;scrollbar-color:rgba(192,132,252,.45) rgba(255,255,255,.035);scrollbar-gutter:stable}
        ::-webkit-scrollbar{width:10px;height:10px}
        ::-webkit-scrollbar-track{background:rgba(255,255,255,.035)}
        ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(192,132,252,.58),rgba(192,132,252,.28));border:2px solid var(--bg);border-radius:999px}
        ::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,rgba(192,132,252,.78),rgba(192,132,252,.42))}
        ::-webkit-scrollbar-corner{background:transparent}
        body{font-family:'Instrument Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
        body::before{content:'';position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.024) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.024) 1px,transparent 1px);background-size:48px 48px}
        a{color:inherit}
        nav{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;border-bottom:1px solid var(--border);background:rgba(13,13,24,.82);backdrop-filter:blur(16px);position:sticky;top:0;z-index:5}
        .brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;text-decoration:none}
        .brand em{font-style:normal;color:var(--accent)}
        .back-link{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-size:.84rem;font-weight:700;border:1px solid var(--border2);border-radius:10px;padding:8px 14px;transition:.18s}
        .back-link:hover{color:var(--text);border-color:rgba(192,132,252,.38);background:rgba(192,132,252,.06)}
        main{max-width:1000px;margin:0 auto;padding:4rem 2rem 5rem}
        .loading,.empty{padding:5rem 1rem;text-align:center;color:var(--muted)}
        .project-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:2rem;align-items:start;margin-bottom:2rem}
        .kicker{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:1rem}
        h1{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(2.3rem,6vw,4.6rem);line-height:1.02;letter-spacing:-.03em;margin-bottom:1rem}
        .summary{font-size:1rem;line-height:1.75;color:var(--muted);max-width:680px}
        .media{border:1px solid var(--border2);border-radius:20px;overflow:hidden;background:#080811;min-height:260px;display:flex;align-items:center;justify-content:center;position:relative}
        .cover-open{display:block;width:100%;border:0;background:transparent;color:var(--text);font:inherit;cursor:zoom-in;position:relative}
        .media img{width:100%;height:clamp(300px,38vw,480px);object-fit:contain;display:block;padding:12px}
        .cover-expand{display:block;font-size:.74rem;font-weight:700;border-top:1px solid var(--border2);padding:10px 12px;background:rgba(192,132,252,.06);text-align:center}
        .cover-open:focus-visible,.gallery-slide:focus-visible,.gallery-button:focus-visible,.gallery-thumb:focus-visible,.viewer-button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
        .placeholder{font-size:3rem;opacity:.22}
        .meta{display:flex;flex-wrap:wrap;gap:8px;margin:1.4rem 0}
        .chip,.status{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--border2);border-radius:100px;padding:5px 10px;color:var(--dim);background:rgba(255,255,255,.04)}
        .status.live{color:var(--now);border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.08)}
        .status.wip{color:#fbbf24;border-color:rgba(251,191,36,.32);background:rgba(251,191,36,.08)}
        .status.archived{color:#94a3b8;border-color:rgba(148,163,184,.28)}
        .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:1.6rem}
        .btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border-radius:10px;padding:10px 18px;font-size:.86rem;font-weight:800;border:1px solid var(--border2);color:var(--muted);transition:.18s}
        .btn.primary{background:var(--accent);border-color:var(--accent);color:#0d0d18}
        .btn:hover{transform:translateY(-2px);color:var(--text);border-color:rgba(192,132,252,.4)}
        .media-section{background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:1.2rem;margin-top:1.2rem;scroll-margin-top:80px}
        .media-section h2{font-family:'Bricolage Grotesque',sans-serif;font-size:1.1rem;letter-spacing:-.02em;margin-bottom:1rem}
        .gallery-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:1rem}
        .gallery-heading h2{margin:0}
        .gallery-count{font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
        .gallery-stage{height:clamp(340px,64svh,620px);position:relative;border:1px solid var(--border2);border-radius:14px;overflow:hidden;background:#080811;touch-action:pan-y pinch-zoom}
        .gallery-slide{display:block;width:100%;height:100%;position:relative;padding:12px;border:0;background:transparent;cursor:zoom-in;color:var(--text);font:inherit}
        .gallery-slide img{display:block;width:100%;height:100%;object-fit:contain;user-select:none}
        [data-gallery-slide][hidden],.image-viewer [hidden]{display:none!important}
        .image-slide-error{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted);font-size:.85rem;line-height:1.6}
        .is-error .image-slide-error{display:flex}
        .is-error img{visibility:hidden}
        .gallery-navigation{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}
        .gallery-hint{font-size:.75rem;line-height:1.5;color:var(--muted);text-align:center}
        .gallery-button,.viewer-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 14px;border:1px solid var(--border2);border-radius:10px;background:var(--bg3);color:var(--text);font:inherit;font-size:.8rem;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
        .gallery-button:hover,.viewer-button:hover{border-color:var(--accent)}
        .gallery-button:disabled,.viewer-button:disabled{opacity:.4;cursor:default}
        .gallery-thumbnails{display:flex;gap:10px;overflow-x:auto;padding:5px 2px 10px;position:relative;overscroll-behavior-x:contain}
        .gallery-thumb{flex:0 0 76px;height:90px;padding:5px;border:2px solid transparent;border-radius:10px;background:var(--bg3);cursor:pointer;position:relative}
        .gallery-thumb.active{border-color:var(--accent);background:rgba(192,132,252,.1)}
        .gallery-thumb img{display:block;width:100%;height:100%;object-fit:contain}
        .gallery-thumb span{position:absolute;bottom:3px;right:3px;font-size:.58rem;line-height:1.3;background:var(--bg);border-radius:4px;padding:2px 4px;color:var(--text)}
        .image-viewer{position:fixed;inset:0;width:100%;height:100dvh;max-width:none;max-height:none;padding:18px;border:0;background:#080811;color:var(--text);overflow:hidden}
        .image-viewer[open]{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px}
        .image-viewer::backdrop{background:rgba(0,0,0,.9)}
        .viewer-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
        .viewer-toolbar>div:first-child{min-width:0;display:flex;align-items:center;gap:14px}
        .viewer-title{font-size:.9rem;max-width:40ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .viewer-count{font-size:.8rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
        .viewer-actions{display:flex;gap:8px;flex-wrap:wrap}
        .viewer-stage{position:relative;min-height:0;overflow:hidden;touch-action:pan-y pinch-zoom;border-radius:10px;background:#050509}
        .viewer-image{display:block;width:100%;height:100%;object-fit:contain;cursor:zoom-in;user-select:none}
        .viewer-stage.is-zoomed{overflow:auto;touch-action:auto}
        .viewer-stage.is-zoomed .viewer-image{height:auto;max-width:none;max-height:none;cursor:zoom-out}
        .viewer-error{padding:3rem 1rem;text-align:center;color:var(--muted);line-height:1.7}
        .viewer-navigation{display:flex;align-items:center;justify-content:space-between;gap:10px}
        .viewer-navigation>span{font-size:.75rem;color:var(--muted);text-align:center}
        .video-box{overflow:hidden;border-radius:14px;border:1px solid var(--border2);background:#05050b}
        .video-box video,.video-box iframe{width:100%;aspect-ratio:16/9;display:block;border:0;background:#05050b}
        .video-link{display:flex;align-items:center;justify-content:center;min-height:120px;color:var(--accent);font-weight:800;text-decoration:none}
        .content{background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:2.2rem;margin-top:2rem}
        .content h2,.content h3{font-family:'Bricolage Grotesque',sans-serif;color:var(--text);margin:1.5rem 0 .7rem;letter-spacing:-.02em}
        .content h2:first-child,.content h3:first-child{margin-top:0}
        .content p{color:var(--muted);line-height:1.85;margin-bottom:1.1rem}
        .content ul,.content ol{color:var(--muted);line-height:1.75;padding-left:1.3rem;margin-bottom:1.1rem}
        .content li{margin-bottom:.4rem}
        .content code{font-family:monospace;background:rgba(192,132,252,.12);border:1px solid rgba(192,132,252,.22);border-radius:5px;padding:2px 6px;color:var(--accent)}
        .content pre{overflow:auto;background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:1rem;margin-bottom:1.1rem}
        .content pre code{background:transparent;border:0;padding:0;color:var(--text)}
        @media(max-width:800px){nav{padding:0 1.2rem}main{padding:3rem 1.2rem 4rem}.project-hero{grid-template-columns:1fr}.media{min-height:210px}.media img{height:420px;max-height:65svh}.content{padding:1.4rem}}
        @media(max-width:520px){.media-section{padding:.85rem}.gallery-navigation{flex-wrap:wrap}.gallery-hint{order:3;flex-basis:100%}.gallery-thumb{flex-basis:64px;height:78px}.gallery-stage{height:clamp(300px,60svh,520px)}.image-viewer{padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}.viewer-toolbar{gap:10px}.viewer-toolbar>div:first-child{width:100%;justify-content:space-between}.viewer-actions{width:100%;justify-content:flex-end}.viewer-button{min-height:44px;padding:8px 10px;font-size:.75rem}.viewer-navigation{flex-wrap:wrap}.viewer-navigation>span{order:3;flex-basis:100%}}
    </style>
</head>

<body>
    <nav>
        <a class="brand" href="index.html">SA<em>.</em></a>
        <a class="back-link" href="index.html#projects">&larr; Back to projects</a>
    </nav>
    <main id="app"><div class="loading">Loading project...</div></main>

    <script src="project-media.js"></script>
    <script src="project-gallery.js"></script>
    <script>
    (function(){
        'use strict';
        const API_BASE='https://portfolio-shafaq.onrender.com';
        const app=document.getElementById('app');
        const params=new URLSearchParams(location.search);
        const key=params.get('id')||params.get('slug')||'';

        function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
        function slugify(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
        function getProjectImages(p){
            return ProjectMedia.getImages(p).filter(ProjectMedia.isImageSource);
        }
        function renderGallery(images,name){
            if(images.length<2)return'';
            return `<section class="media-section project-gallery" data-image-gallery aria-label="Project image gallery">
                <div class="gallery-heading"><h2>Project Images</h2><span class="gallery-count" data-gallery-count aria-live="polite">1 / ${images.length}</span></div>
                <div class="gallery-stage" data-gallery-swipe>
                    ${images.map((src,i)=>`<button type="button" class="gallery-slide" data-gallery-slide data-open-image="${i}" ${i?'hidden':''} aria-label="Open ${esc(name)} image ${i+1} fullscreen">
                        <img src="${esc(src)}" alt="${esc(name)} ${i===0?'cover':'image '+(i+1)}" draggable="false" ${i?'loading="lazy"':''}>
                        <span class="image-slide-error">Image could not be loaded. Tap to open the viewer or try the next image.</span>
                    </button>`).join('')}
                </div>
                <div class="gallery-navigation">
                    <button type="button" class="gallery-button" data-gallery-step="-1" aria-label="Previous project image">&larr; Previous</button>
                    <p class="gallery-hint">Swipe or use arrows &middot; Tap image to enlarge</p>
                    <button type="button" class="gallery-button" data-gallery-step="1" aria-label="Next project image">Next &rarr;</button>
                </div>
                <div class="gallery-thumbnails" data-gallery-thumbnails aria-label="Choose a project image">
                    ${images.map((src,i)=>`<button type="button" class="gallery-thumb${i?'':' active'}" data-gallery-to="${i}" aria-label="Show ${i===0?'cover image':'project image '+(i+1)}" aria-pressed="${i===0}">
                        <img src="${esc(src)}" alt="" loading="lazy" draggable="false"><span>${i===0?'Cover':i+1}</span>
                    </button>`).join('')}
                </div>
            </section>`;
        }
        function renderVideo(url){
            const video=ProjectMedia.videoSource(url);
            if(['empty','invalid'].includes(video.kind))return'';
            if(video.kind==='youtube')return `<section class="media-section"><h2>Project Video</h2><div class="video-box"><iframe src="${esc(video.src)}" title="Project video" allowfullscreen></iframe></div></section>`;
            if(video.kind==='file')return `<section class="media-section"><h2>Project Video</h2><div class="video-box"><video controls preload="metadata" src="${esc(video.src)}"></video></div></section>`;
            return `<section class="media-section"><h2>Project Video</h2><div class="video-box"><a class="video-link" href="${esc(video.src)}" target="_blank" rel="noopener">Open Project Video</a></div></section>`;
        }
        function mdToHtml(text){
            if(!text)return'';
            return text
                .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/```[\w]*\n?([\s\S]*?)```/g,'<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/g,'<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
                .replace(/^## (.+)$/gm,'<h2>$1</h2>')
                .replace(/^### (.+)$/gm,'<h3>$1</h3>')
                .replace(/^[-*] (.+)$/gm,'<li>$1</li>')
                .replace(/(<li>[\s\S]*?<\/li>)(\n|$)/g,'<ul>$1</ul>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
                .split(/\n{2,}/).map(part=>/^<(\w+)/.test(part.trim())?part:'<p>'+part.replace(/\n/g,' ')+'</p>').join('');
        }
        function findProject(projects){
            if(!projects||!projects.length)return null;
            return projects.find(p=>String(p._id||'')===key||String(p.slug||'')===key||slugify(p.name)===key)||null;
        }
        function renderProject(p){
            const status=(p.status||'WIP').toLowerCase();
            const images=getProjectImages(p);
            const cover=images[0]||'';
            const description=String(p.description||'').trim();
            const fullContent=String(p.content||'').trim();
            const hasContent=fullContent&&fullContent!==description;
            const category=String(p.category||'').trim();
            const galleryHtml=renderGallery(images,p.name||'Project');
            document.title=(p.name||'Project')+' - Project Details';
            app.innerHTML=`
<section class="project-hero">
  <div>
    <div class="kicker">Project Details</div>
    <h1>${esc(p.name||'Untitled Project')}</h1>
    ${p.description?`<p class="summary">${esc(p.description)}</p>`:''}
    <div class="meta">
      <span class="status ${esc(status)}">${esc(p.status||'WIP')}</span>
      ${category?`<span class="chip">${esc(category)}</span>`:''}
      ${(p.tech_tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}
    </div>
    <div class="actions">
      ${p.live?`<a class="btn primary" href="${esc(p.live)}" target="_blank" rel="noopener">Open Live Demo</a>`:''}
      ${p.dashboard_url?`<a class="btn" href="${esc(p.dashboard_url)}" target="_blank" rel="noopener">Open Dashboard</a>`:''}
      ${p.website_url?`<a class="btn" href="${esc(p.website_url)}" target="_blank" rel="noopener">Open Website</a>`:''}
      ${p.github?`<a class="btn" href="${esc(p.github)}" target="_blank" rel="noopener">View GitHub</a>`:''}
    </div>
  </div>
  <div class="media">${cover?`<button type="button" class="cover-open" data-open-image="0" aria-label="Open ${esc(p.name)} cover image fullscreen"><img src="${esc(cover)}" alt="${esc(p.name)} cover" draggable="false"><span class="cover-expand">Expand image &nearr;</span><span class="image-slide-error">Cover could not be loaded. Tap to browse project images.</span></button>`:`<div class="placeholder">Project</div>`}</div>
</section>
${renderVideo(p.video_url)}
${galleryHtml}
${hasContent?`<article class="content">${mdToHtml(fullContent)}</article>`:''}`;
            const gallery=app.querySelector('[data-image-gallery]');
            if(gallery)ProjectGalleries.carousel(gallery);
            const viewer=ProjectGalleries.viewer(images,p.name||'Project');
            app.querySelectorAll('[data-open-image]').forEach(button=>button.addEventListener('click',()=>viewer.open(Number(button.dataset.openImage),button)));
            const coverButton=app.querySelector('.cover-open');
            if(coverButton){
                const img=coverButton.querySelector('img');
                const update=()=>coverButton.classList.toggle('is-error',img.complete&&!img.naturalWidth);
                img.addEventListener('load',update);
                img.addEventListener('error',update);
                if(img.complete)update();
            }
        }
        fetch(API_BASE+'/api/portfolio')
            .then(r=>r.json())
            .then(data=>{
                const project=findProject(data.projects||[]);
                if(!project){app.innerHTML='<div class="empty">Project not found.</div>';return;}
                renderProject(project);
            })
            .catch(()=>{app.innerHTML='<div class="empty">Could not load project details. Please try again later.</div>';});
    })();
    </script>
</body>

</html>
