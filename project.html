<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Details - Shaikh Shafaq Ali</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root{--bg:#0d0d18;--bg2:#13131f;--bg3:#1a1a2e;--card:#161624;--text:#eeeef5;--muted:rgba(238,238,245,.58);--dim:rgba(238,238,245,.34);--accent:#c084fc;--now:#4ade80;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12)}
        *{box-sizing:border-box;margin:0;padding:0}
        html{scrollbar-width:thin;scrollbar-color:rgba(192,132,252,.45) rgba(255,255,255,.035);scrollbar-gutter:stable}
        ::-webkit-scrollbar{width:10px;height:10px}
        ::-webkit-scrollbar-track{background:rgba(255,255,255,.035)}
        ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(192,132,252,.58),rgba(192,132,252,.28));border:2px solid var(--bg);border-radius:999px}
        ::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,rgba(192,132,252,.78),rgba(192,132,252,.42))}
        ::-webkit-scrollbar-corner{background:transparent}
        body{font-family:'Instrument Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
        body::before{content:'';position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.024) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.024) 1px,transparent 1px);background-size:48px 48px}
        a{color:inherit}
        nav{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;border-bottom:1px solid var(--border);background:rgba(13,13,24,.82);backdrop-filter:blur(16px);position:sticky;top:0;z-index:5}
        .brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;text-decoration:none}
        .brand em{font-style:normal;color:var(--accent)}
        .back-link{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-size:.84rem;font-weight:700;border:1px solid var(--border2);border-radius:10px;padding:8px 14px;transition:.18s}
        .back-link:hover{color:var(--text);border-color:rgba(192,132,252,.38);background:rgba(192,132,252,.06)}
        main{max-width:1000px;margin:0 auto;padding:4rem 2rem 5rem}
        .loading,.empty{padding:5rem 1rem;text-align:center;color:var(--muted)}
        .project-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:2rem;align-items:start;margin-bottom:2rem}
        .kicker{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:1rem}
        h1{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(2.3rem,6vw,4.6rem);line-height:1.02;letter-spacing:-.03em;margin-bottom:1rem}
        .summary{font-size:1rem;line-height:1.75;color:var(--muted);max-width:680px}
        .media{border:1px solid var(--border2);border-radius:20px;overflow:hidden;background:var(--bg3);min-height:260px;display:flex;align-items:center;justify-content:center}
        .media img{width:100%;height:100%;max-height:420px;object-fit:cover;display:block}
        .placeholder{font-size:3rem;opacity:.22}
        .meta{display:flex;flex-wrap:wrap;gap:8px;margin:1.4rem 0}
        .chip,.status{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--border2);border-radius:100px;padding:5px 10px;color:var(--dim);background:rgba(255,255,255,.04)}
        .status.live{color:var(--now);border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.08)}
        .status.wip{color:#fbbf24;border-color:rgba(251,191,36,.32);background:rgba(251,191,36,.08)}
        .status.archived{color:#94a3b8;border-color:rgba(148,163,184,.28)}
        .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:1.6rem}
        .btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border-radius:10px;padding:10px 18px;font-size:.86rem;font-weight:800;border:1px solid var(--border2);color:var(--muted);transition:.18s}
        .btn.primary{background:var(--accent);border-color:var(--accent);color:#0d0d18}
        .btn:hover{transform:translateY(-2px);color:var(--text);border-color:rgba(192,132,252,.4)}
        .media-section{background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:1.2rem;margin-top:1.2rem}
        .media-section h2{font-family:'Bricolage Grotesque',sans-serif;font-size:1.1rem;letter-spacing:-.02em;margin-bottom:1rem}
        .gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
        .gallery-grid img{width:100%;aspect-ratio:1.45;object-fit:cover;border-radius:12px;border:1px solid var(--border2);background:var(--bg3)}
        .video-box{overflow:hidden;border-radius:14px;border:1px solid var(--border2);background:#05050b}
        .video-box video,.video-box iframe{width:100%;aspect-ratio:16/9;display:block;border:0;background:#05050b}
        .video-link{display:flex;align-items:center;justify-content:center;min-height:120px;color:var(--accent);font-weight:800;text-decoration:none}
        .content{background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:2.2rem;margin-top:2rem}
        .content h2,.content h3{font-family:'Bricolage Grotesque',sans-serif;color:var(--text);margin:1.5rem 0 .7rem;letter-spacing:-.02em}
        .content h2:first-child,.content h3:first-child{margin-top:0}
        .content p{color:var(--muted);line-height:1.85;margin-bottom:1.1rem}
        .content ul,.content ol{color:var(--muted);line-height:1.75;padding-left:1.3rem;margin-bottom:1.1rem}
        .content li{margin-bottom:.4rem}
        .content code{font-family:monospace;background:rgba(192,132,252,.12);border:1px solid rgba(192,132,252,.22);border-radius:5px;padding:2px 6px;color:var(--accent)}
        .content pre{overflow:auto;background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:1rem;margin-bottom:1.1rem}
        .content pre code{background:transparent;border:0;padding:0;color:var(--text)}
        @media(max-width:800px){nav{padding:0 1.2rem}main{padding:3rem 1.2rem 4rem}.project-hero{grid-template-columns:1fr}.media{min-height:210px}.content{padding:1.4rem}.gallery-grid{grid-template-columns:1fr 1fr}}
        @media(max-width:520px){.gallery-grid{grid-template-columns:1fr}}
    </style>
</head>

<body>
    <nav>
        <a class="brand" href="index.html">SA<em>.</em></a>
        <a class="back-link" href="index.html#projects">&larr; Back to projects</a>
    </nav>
    <main id="app"><div class="loading">Loading project...</div></main>

    <script>
    (function(){
        'use strict';
        const API_BASE='https://portfolio-shafaq.onrender.com';
        const app=document.getElementById('app');
        const params=new URLSearchParams(location.search);
        const key=params.get('id')||params.get('slug')||'';

        function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
        function slugify(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
        function getProjectImages(p){
            const images=[p.image_url].concat(Array.isArray(p.media_images)?p.media_images:[]);
            const seen=new Set();
            return images.map(src=>String(src||'').trim()).filter(src=>{
                if(!src||seen.has(src))return false;
                seen.add(src);
                return true;
            });
        }
        function isDirectVideoSrc(url){
            return /^data:video\//i.test(url)||/\.(mp4|webm|ogg)(\?.*)?$/i.test(url);
        }
        function youtubeId(url){
            const value=String(url||'');
            const short=value.match(/youtu\.be\/([^?&]+)/);
            if(short)return short[1];
            const long=value.match(/[?&]v=([^?&]+)/);
            if(long)return long[1];
            const embed=value.match(/youtube\.com\/embed\/([^?&/]+)/);
            return embed?embed[1]:'';
        }
        function renderVideo(url){
            const value=String(url||'').trim();
            if(!value)return'';
            const id=youtubeId(value);
            if(id)return `<section class="media-section"><h2>Project Video</h2><div class="video-box"><iframe src="https://www.youtube.com/embed/${esc(id)}" title="Project video" allowfullscreen></iframe></div></section>`;
            if(isDirectVideoSrc(value))return `<section class="media-section"><h2>Project Video</h2><div class="video-box"><video controls src="${esc(value)}"></video></div></section>`;
            return `<section class="media-section"><h2>Project Video</h2><div class="video-box"><a class="video-link" href="${esc(value)}" target="_blank" rel="noopener">Open Project Video</a></div></section>`;
        }
        function mdToHtml(text){
            if(!text)return'';
            return text
                .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/```[\w]*\n?([\s\S]*?)```/g,'<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/g,'<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
                .replace(/^## (.+)$/gm,'<h2>$1</h2>')
                .replace(/^### (.+)$/gm,'<h3>$1</h3>')
                .replace(/^[-*] (.+)$/gm,'<li>$1</li>')
                .replace(/(<li>[\s\S]*?<\/li>)(\n|$)/g,'<ul>$1</ul>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
                .split(/\n{2,}/).map(part=>/^<(\w+)/.test(part.trim())?part:'<p>'+part.replace(/\n/g,' ')+'</p>').join('');
        }
        function findProject(projects){
            if(!projects||!projects.length)return null;
            return projects.find(p=>String(p._id||'')===key||String(p.slug||'')===key||slugify(p.name)===key)||null;
        }
        function renderProject(p){
            const status=(p.status||'WIP').toLowerCase();
            const images=getProjectImages(p);
            const cover=p.image_url||images[0]||'';
            const gallery=images.filter(src=>src!==cover);
            const description=String(p.description||'').trim();
            const fullContent=String(p.content||'').trim();
            const hasContent=fullContent&&fullContent!==description;
            const category=String(p.category||'').trim();
            const galleryHtml=gallery.length?`<section class="media-section"><h2>Project Images</h2><div class="gallery-grid">${gallery.map((src,i)=>`<img src="${esc(src)}" alt="${esc(p.name)} image ${i+1}" onerror="this.remove()">`).join('')}</div></section>`:'';
            document.title=(p.name||'Project')+' - Project Details';
            app.innerHTML=`
<section class="project-hero">
  <div>
    <div class="kicker">Project Details</div>
    <h1>${esc(p.name||'Untitled Project')}</h1>
    ${p.description?`<p class="summary">${esc(p.description)}</p>`:''}
    <div class="meta">
      <span class="status ${esc(status)}">${esc(p.status||'WIP')}</span>
      ${category?`<span class="chip">${esc(category)}</span>`:''}
      ${(p.tech_tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}
    </div>
    <div class="actions">
      ${p.live?`<a class="btn primary" href="${esc(p.live)}" target="_blank" rel="noopener">Open Live Demo</a>`:''}
      ${p.dashboard_url?`<a class="btn" href="${esc(p.dashboard_url)}" target="_blank" rel="noopener">Open Dashboard</a>`:''}
      ${p.website_url?`<a class="btn" href="${esc(p.website_url)}" target="_blank" rel="noopener">Open Website</a>`:''}
      ${p.github?`<a class="btn" href="${esc(p.github)}" target="_blank" rel="noopener">View GitHub</a>`:''}
    </div>
  </div>
  <div class="media">${cover?`<img src="${esc(cover)}" alt="${esc(p.name)}" onerror="this.parentElement.innerHTML='<div class=&quot;placeholder&quot;>Project</div>'">`:`<div class="placeholder">Project</div>`}</div>
</section>
${renderVideo(p.video_url)}
${galleryHtml}
${hasContent?`<article class="content">${mdToHtml(fullContent)}</article>`:''}`;
        }
        fetch(API_BASE+'/api/portfolio')
            .then(r=>r.json())
            .then(data=>{
                const project=findProject(data.projects||[]);
                if(!project){app.innerHTML='<div class="empty">Project not found.</div>';return;}
                renderProject(project);
            })
            .catch(()=>{app.innerHTML='<div class="empty">Could not load project details. Please try again later.</div>';});
    })();
    </script>
</body>

</html>
